<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Portfolio</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuración de colores personalizados de Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-heading': '#1f2937', 
            'light-heading': '#f3f4f6', 
            'dark-card': '#374151',
            'content': '#4b5563',
            'light-content': '#d1d5db'
          }
        }
      }
    }
  </script>
  <style>
    /* ---- particles.js container ---- */ 
    #particles-js { 
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw; 
      height: 100vh; 
      background-color: #000000; 
      background-repeat: no-repeat; 
      background-size: cover; 
      background-position: 50% 50%; 
      z-index: -1000;
    }
    
    body {
      position: relative;
    }
  </style>
</head>
<body class="bg-transparent transition-colors duration-300">

  <!-- Contenedor de Partículas -->
  <div id="particles-js"></div> 
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script> 

  <!-- ================= HEADER ================= -->
  <header class="bg-white w-full z-10 relative">
    <div class="container mx-auto md:flex justify-between py-2 px-5 max-w-7xl">
      <div class="flex justify-between items-center py-1 md:py-1">
        <!-- Logo -->
        <a href="index.html">
          <img class="w-14" src="img/feral2.png" alt="logo" />
        </a>
        
        <!-- Botón Menú Móvil -->
        <div id="menu-btn" class="cursor-pointer md:hidden">
          <svg class="stroke-black" width="25" height="20" viewBox="0 0 16 13" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1.4375 1.3125H14.5625M1.4375 11.3125H14.5625H1.4375ZM1.4375 6.3125H14.5625H1.4375Z" stroke-width="1.875" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </div>

      <!-- Navegación -->
      <nav id="mobile-menu" class="hidden text-center md:flex justify-between w-full md:w-auto">
        <ul class="text-black font-medium md:flex items-center md:space-x-5 md:mr-7">
          <li class="pb-2 md:pb-0"><a href="https://feralcode0x.github.io" class="hover:text-blue-500">Projects</a></li>
          <li class="pb-2 md:pb-0"><a href="https://feralcode0x.github.io/about.html" class="hover:text-blue-500">About</a></li>
          <li class="pb-2 md:pb-0"><a href="https://feralcode0x.github.io/stack.html" class="hover:text-blue-500">Stack</a></li>
          <li class="pb-2 md:pb-0"><a href="https://feralcode0x.github.io/contact.html" class="text-blue-500 hover:text-blue-500">Contact</a></li>
        </ul>
        
        <!-- Redes Sociales -->
        <ul class="flex justify-center items-center my-5 md:my-0 md:space-x-5 md:mr-5">
          <li>
            <a href="https://github.com/feralCode0x" target="_blank" rel="noreferrer noopener">
              <svg class="fill-black hover:fill-blue-500 transition-colors" width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" fill-rule="evenodd" clip-rule="evenodd">
                <path d="M15 0C6.7125 0 0 6.7125 0 15C0 21.6375 4.29375 27.2437 10.2563 29.2313C11.0063 29.3625 11.2875 28.9125 11.2875 28.5188C11.2875 28.1625 11.2688 26.9813 11.2688 25.725C7.5 26.4188 6.525 24.8062 6.225 23.9625C6.05625 23.5312 5.325 22.2 4.6875 21.8438C4.1625 21.5625 3.4125 20.8687 4.66875 20.85C5.85 20.8313 6.69375 21.9375 6.975 22.3875C8.325 24.6562 10.4812 24.0187 11.3438 23.625C11.475 22.65 11.8688 21.9937 12.3 21.6187C8.9625 21.2437 5.475 19.95 5.475 14.2125C5.475 12.5813 6.05625 11.2313 7.0125 10.1813C6.8625 9.80625 6.3375 8.26875 7.1625 6.20625C7.1625 6.20625 8.41875 5.8125 11.2875 7.74375C12.4875 7.40625 13.7625 7.2375 15.0375 7.2375C16.3125 7.2375 17.5875 7.40625 18.7875 7.74375C21.6562 5.79375 22.9125 6.20625 22.9125 6.20625C23.7375 8.26875 23.2125 9.80625 23.0625 10.1813C24.0188 11.2313 24.6 12.5625 24.6 14.2125C24.6 19.9688 21.0938 21.2437 17.7563 21.6187C18.3 22.0875 18.7688 22.9875 18.7688 24.3937C18.7688 26.4 18.75 28.0125 18.75 28.5188C18.75 28.9125 19.0312 29.3813 19.7812 29.2313C22.759 28.2259 25.3465 26.3121 27.1796 23.7592C29.0127 21.2063 29.9991 18.1429 30 15C30 6.7125 23.2875 0 15 0Z"/>
              </svg>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ================= MAIN: CONTACT CARD ================= -->
  <main class="container mx-auto px-5 max-w-7xl min-h-[calc(100vh-100px)] flex items-center justify-center relative z-10 py-10">

    <!-- Tarjeta de Contacto Centraba -->
    <article class="w-full max-w-lg bg-gray-900/80 backdrop-blur-md border border-gray-800 rounded-2xl p-8 sm:p-10 shadow-2xl text-center">
      
      <!-- Icono superior -->
      <div class="mx-auto w-16 h-16 bg-blue-600/20 text-blue-500 rounded-full flex items-center justify-center mb-6">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
      </div>

      <!-- Títulos -->
      <h1 class="text-3xl font-bold text-white mb-3">Get in Touch</h1>
      <p class="text-light-content text-sm sm:text-base mb-8">
        For any questions, collaboration opportunities, or project inquiries, feel free to reach out directly through email or GitHub.
      </p>
      <p class="text-light-content text-sm sm:text-base mb-8">Phone: +56 9 42143376</p>
      <!-- Canales de contacto -->
      <div class="space-y-4">
        
        <!-- Email Link/Button -->
        <a href="mailto:feralcode0x@gmail.com" class="flex items-center justify-center gap-3 w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-5 rounded-xl transition-all duration-200 shadow-lg shadow-blue-600/20">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
          Send an Email
        </a>

        <!-- GitHub Link/Button -->
        <a href="https://github.com/feralCode0x" target="_blank" rel="noreferrer noopener" class="flex items-center justify-center gap-3 w-full bg-gray-800 hover:bg-gray-700 text-white font-medium py-3 px-5 rounded-xl border border-gray-700 transition-all duration-200">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          Visit GitHub Profile
        </a>

      </div>

      <!-- Footer interno de la tarjeta -->
      <div class="mt-8 pt-6 border-t border-gray-800 text-xs text-gray-400 flex items-center justify-center gap-2">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        Available for freelance work & full-time roles
      </div>

    </article>

  </main>

  <!-- Script Particles.js -->
  <script>
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
        "color": { "value": "#ffffff" },
        "shape": { "type": "circle", "stroke": { "width": 0, "color": "#000000" } },
        "opacity": { "value": 0.5, "random": false },
        "size": { "value": 3, "random": true },
        "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.4, "width": 1 },
        "move": { "enable": true, "speed": 6 }
      },
      "interactivity": {
        "events": {
          "onhover": { "enable": true, "mode": "repulse" },
          "onclick": { "enable": true, "mode": "push" },
          "resize": true
        }
      },
      "retina_detect": true
    });

    // Menú móvil
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');

    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });
  </script>
</body>
</html>
